// ---- shared stage, thread geometry, audio, cue helpers ----
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let W = 390, H = 844, DPR = 1;
function resize() {
  const r = cvs.getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);

const N = 14;                       // number of threads
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const now = () => performance.now() / 1000;

// y offset of thread i at normalized position u (0 = left anchor, 1 = right end)
// spread: 1 = full fan, 0 = gathered into one line
function threadY(i, u, spread, bulge) {
  const k = (i - (N - 1) / 2) / ((N - 1) / 2);   // -1..1
  const cy = H * 0.5;
  const edge = 9;                                // thread spacing at the ends
  const mid = H * 0.17 * bulge;                  // extra spacing in the middle
  return cy + k * spread * (edge + mid * Math.sin(Math.PI * u));
}

// ---- audio ----
let AC = null, master = null;
function audio() {
  if (!AC) {
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      master = AC.createGain(); master.gain.value = 0.55;
      const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
      master.connect(lp); lp.connect(AC.destination);
    } catch (e) { AC = null; }
  }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
// soft, slow-attack tone (silky: no hard transient)
function tone(freq, dur = 1.6, vol = 0.18, delay = 0, type = 'sine') {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  const o2 = a.createOscillator();              // slight detune for sheen
  o.type = type; o2.type = 'sine';
  o.frequency.value = freq; o2.frequency.value = freq * 1.003;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.06);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); o2.connect(g); g.connect(master);
  o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
}

// continuous voice (for stretching / gathering)
function makeVoice(type = 'triangle') {
  const a = audio(); if (!a) return null;
  const o = a.createOscillator(), g = a.createGain(), f = a.createBiquadFilter();
  o.type = type; f.type = 'lowpass'; f.frequency.value = 900; f.Q.value = 4;

  o.connect(f); f.connect(g); g.connect(master); o.start();
  return {
    set(freq, vol, cutoff) {
      const t = a.currentTime;
      o.frequency.setTargetAtTime(freq, t, 0.05);
      g.gain.setTargetAtTime(Math.max(vol, 0.0001), t, 0.08);

    off() { g.gain.setTargetAtTime(0.0001, a.currentTime, 0.15); }
  };
}

// ---- cue helpers ----
// ghost fingertip: soft ring + trail
function ghost(x, y, alpha, r = 18) {
  if (alpha <= 0.01) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = '#e8e8e8'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();

  ctx.restore();
}
function touchRipple(list, t) {
  for (let i = list.length - 1; i >= 0; i--) {
    const p = list[i], age = t - p.t;
    if (age > 0.6) { list.splice(i, 1); continue; }
    ctx.save();
    ctx.globalAlpha = (1 - age / 0.6) * 0.5;
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(p.x, p.y, 10 + age * 60, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

// ---- pointer helpers ----
function pos(e) {
